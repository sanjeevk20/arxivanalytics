[project]
name = "arxiv-analytics"
version = "0.1.0"
description = "Web UI for searching, filtering and analysing arXiv research by topic and category"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
arxiv-analytics = "arxiv_analytics.server:main"

[tool.setuptools.packages.find]
include = ["arxiv_analytics*"]

[tool.setuptools.package-data]
arxiv_analytics = ["static/*"]
